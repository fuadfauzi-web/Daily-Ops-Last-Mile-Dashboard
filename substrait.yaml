description: >
  Live operations dashboard for Ninja Van's Southern Region (Negeri Sembilan, Melaka,
  Johor) last-mile fleet. Pulls parcel-level data hourly from Redash and shows
  parcels-in-hub, zero-attempt, on-hold, and open missing-parcel counts by station,
  sub-region, and region. Access is role-based: admins see everything and manage who
  can see what, sub-region managers see their sub-region, station staff see only
  their station. For the Fleet Manager and their regional/station team.

database: oceanbase

