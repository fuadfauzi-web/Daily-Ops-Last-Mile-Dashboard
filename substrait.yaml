description: >
  Live nationwide operations dashboard for Ninja Van Malaysia's last-mile fleet team
  (143 stations across Southern, Northern, Klang Valley, East Coast and East Malaysia --
  East Malaysia is Retail, not Last Mile, so it can be toggled out of every view).
  Pulls parcel- and route-level data from Redash every 15 minutes and shows it per
  region, zone, station and driver: Action Board (SLA heatmap), Shipment Details
  (fresh unscan, latlong, scan-in duration buckets and an hourly timing chart), Station
  Health (in-hub, 0-attempt, on-hold, aging, missing, pending ATS, COD%), Route
  Monitoring (routed, attendance, OVFD, success and completion rates by driver type,
  old routes, pending-in-yesterday-route, completion summary), Aging Details, RPU,
  Recovery (missing parcels), Shipper Radar (Zalora, Amway, Watson, Orca, Sodaxpress
  SLAs; Restock NXD bundles, on-hold / incomplete MPS bundles; B2B RDO document
  compliance), Cold Chain and Urgent TN (track tracking numbers and assign them to a
  PIC with in-progress / closed status and notifications), DoD (Station Health day by
  day), a Task List (follow-ups, to-dos, assigned tasks) and a KPI page (Beta) with the
  weekly results, the OPEX result and RCA / analysis for Hybrid Productivity, Invalid POD,
  COD RTS, Prior, Completion D0 / D3, Terminal T7 and FIFO D0, judged against KPI
  targets per region that an admin sets. Every count opens its
  tracking numbers, with CSV export. Access is role-based (admin, manager, region,
  station) with multi-value region/zone/station scopes enforced in the backend; an
  admin can preview any role or user with the Role Tester. Users can send feedback
  (with an attachment) that admins reply to and close. For Fleet Managers and their
  regional and station teams.

database: oceanbase

services:
  object-storage: {}

